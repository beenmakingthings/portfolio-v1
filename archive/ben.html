<div id="loader-overlay">
  <div id="loader-strips">
    <div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div>
  </div>
  <button id="explore-btn" class="explore-btn" type="button">Explore</button>
</div>
<script>
  (() => {
    const overlay = document.getElementById('loader-overlay');
    const exploreBtn = document.getElementById('explore-btn');
    if (!overlay || !exploreBtn) return;

    if (sessionStorage.getItem('introSeen')) {
      overlay.style.display = 'none';
      return;
    }

    const strips = overlay.querySelectorAll('.loader-strip');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    exploreBtn.addEventListener('click', () => {
      sessionStorage.setItem('introSeen', '1');
      if (reduceMotion) {
        overlay.style.display = 'none';
        return;
      }
      const totalMs = 900;
      const stripTransitionMs = 450;
      const stagger = (totalMs - stripTransitionMs) / (strips.length - 1);

      exploreBtn.style.transform = 'rotate(360deg)';
      strips.forEach((strip, i) => {
        setTimeout(() => { strip.style.transform = 'translateY(-100%)'; }, i * stagger);
      });
      setTimeout(() => { exploreBtn.style.opacity = '0'; }, 300);
      setTimeout(() => { overlay.style.display = 'none'; }, totalMs);
    });
  })();
</script>

<script>
  (() => {
    const dropdowns = document.querySelectorAll('.nav-dropdown');
    dropdowns.forEach((dropdown) => {
      const trigger = dropdown.querySelector('.nav-trigger');
      if (!trigger) return;
      // opens on hover, but then STAYS open (even after the mouse leaves) until
      // something is clicked — the trigger again, a link inside, or anywhere outside
      dropdown.addEventListener('mouseenter', () => {
        dropdowns.forEach((d) => { if (d !== dropdown) d.classList.remove('open'); });
        dropdown.classList.add('open');
      });
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = dropdown.classList.contains('open');
        dropdowns.forEach((d) => d.classList.remove('open'));
        if (!wasOpen) dropdown.classList.add('open');
      });
    });
    document.addEventListener('click', () => {
      dropdowns.forEach((d) => d.classList.remove('open'));
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') dropdowns.forEach((d) => d.classList.remove('open'));
    });
  })();
</script>
