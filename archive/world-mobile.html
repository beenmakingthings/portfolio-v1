<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>World · Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  :root {
    --console-grid: rgba(176,141,87,0.14);
    --console-line: rgba(47,82,73,0.35);
    --console-active: var(--ink);
    --console-dim: rgba(44,44,44,0.55);
  }

  body { -webkit-text-size-adjust: 100%; }

  /* ============ mobile nav (hamburger) ============ */
  #m-nav {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px clamp(16px, 5vw, 24px);
    padding-top: max(14px, env(safe-area-inset-top));
    background: color-mix(in srgb, var(--page-bg) 82%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--hairline);
  }
  #m-nav .brand img { height: 34px; width: auto; display: block; }
  .m-burger {
    width: 44px; height: 44px; flex-shrink: 0;
    display: inline-flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    background: none; border: none; cursor: pointer; padding: 0;
  }
  .m-burger span {
    display: block; width: 24px; height: 2px; background: var(--ink); border-radius: 2px;
    transition: transform 0.28s ease, opacity 0.2s ease;
  }
  .m-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .m-burger.open span:nth-child(2) { opacity: 0; }
  .m-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .m-menu {
    position: fixed; inset: 0; z-index: 39;
    background: var(--page-bg);
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
    padding: 0 32px calc(40px + env(safe-area-inset-bottom));
    transform: translateY(-100%);
    transition: transform 0.4s cubic-bezier(.16,1,.3,1);
    overflow-y: auto;
  }
  .m-menu.open { transform: translateY(0); }
  .m-menu a, .m-menu .m-group-label {
    font-family: 'Bodoni Moda', serif; font-weight: 700;
    text-transform: uppercase; letter-spacing: var(--label-tracking);
    color: var(--ink); text-decoration: none;
  }
  .m-menu a { font-size: 30px; padding: 12px 0; opacity: 0.85; }
  .m-menu a.active { color: var(--muted); opacity: 1; }
  .m-group-label {
    font-size: 12px; color: var(--muted); opacity: 0.7;
    margin: 22px 0 2px;
  }

  /* ============ header ============ */
  .m-head {
    padding: 26px clamp(16px, 5vw, 24px) 16px;
  }
  .m-head h1 {
    font-family: 'Bodoni Moda', serif; font-weight: 700;
    text-transform: uppercase; letter-spacing: var(--label-tracking);
    color: var(--ink); font-size: 30px; margin: 0 0 8px;
  }
  .m-meta {
    display: flex; gap: 18px; align-items: baseline;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em;
    color: var(--console-dim);
  }
  .m-meta b { color: var(--console-active); font-weight: 600; }

  /* ============ map ============ */
  .m-map-wrap { padding: 0 clamp(12px, 4vw, 20px); }
  .m-map-frame {
    position: relative; background: #fff;
    border: 1px solid var(--hairline); padding: 10px;
  }
  .m-map-viewport {
    position: relative; overflow: hidden;
    aspect-ratio: 4378.13 / 2434.94;
    background: #fff; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  .m-zoom-layer { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
  .m-grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(to right, var(--console-grid) 0, var(--console-grid) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(to bottom, var(--console-grid) 0, var(--console-grid) 1px, transparent 1px, transparent 34px);
  }
  .m-map-img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: invert(1); -webkit-user-drag: none; pointer-events: none;
  }

  /* pins — enlarged for touch */
  .m-pin {
    position: absolute; transform: translate(-50%, -100%);
    width: 30px; height: 40px; display: block; text-decoration: none;
  }
  .m-pin .pin-hit {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 44px; height: 48px;
  }
  .m-pin svg {
    position: relative; z-index: 2; display: block; width: 30px; height: 40px;
    fill: var(--console-line); stroke: #fff; stroke-width: 1;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
    transition: fill 0.2s ease, transform 0.2s ease;
    transform-origin: 50% 100%;
  }
  .m-pin.pin-active svg { fill: var(--console-active); transform: scale(1.16); }
  .m-pin .pin-ring {
    position: absolute; left: 50%; bottom: -1px;
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid var(--console-active);
    opacity: 0; transform: translate(-50%,0) scale(0.5);
  }
  .m-pin.pin-active .pin-ring { animation: m-pulse 1.4s ease-out infinite; }
  @keyframes m-pulse {
    0% { opacity: 0.8; transform: translate(-50%,0) scale(0.5); }
    100% { opacity: 0; transform: translate(-50%,0) scale(2.1); }
  }

  /* compass + zoom */
  .m-compass {
    position: absolute; top: 16px; right: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--console-line); background: rgba(255,255,255,0.85); z-index: 4;
  }
  .m-compass::before {
    content:''; position:absolute; top:50%; left:50%; width:4px; height:4px;
    border-radius:50%; background: var(--console-active); transform: translate(-50%,-50%);
  }
  .m-compass span {
    position: absolute; font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:600; color: var(--ink);
  }
  .m-compass .n { top:4px; left:50%; transform:translateX(-50%); color: var(--console-active); }
  .m-compass .s { bottom:4px; left:50%; transform:translateX(-50%); }
  .m-compass .e { right:5px; top:50%; transform:translateY(-50%); }
  .m-compass .w { left:5px; top:50%; transform:translateY(-50%); }

  .m-zoom {
    position: absolute; bottom: 16px; right: 16px; z-index: 4;
    display: flex; flex-direction: column; gap: 8px;
  }
  .m-zoom button {
    width: 42px; height: 42px; border-radius: 8px;
    border: 1px solid var(--console-line); background: rgba(255,255,255,0.92);
    color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .m-zoom button:active { background: var(--ink); color: #fff; }
  .m-hint {
    position: absolute; bottom: 16px; left: 16px; z-index: 4;
    font-family:'JetBrains Mono',monospace; font-size: 10px; letter-spacing: 0.03em;
    color: var(--console-active); background: rgba(255,255,255,0.88);
    border: 1px solid var(--console-line); padding: 5px 9px;
    transition: opacity 0.4s ease;
  }

  /* ============ manifest list (primary browse) ============ */
  .m-list-label {
    padding: 30px clamp(16px, 5vw, 24px) 6px;
    font-family:'JetBrains Mono',monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .m-list { list-style: none; margin: 0; padding: 0 clamp(12px, 4vw, 20px) 8px; }
  .m-list li {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 14px;
    border-bottom: 1px solid rgba(176,141,87,0.2);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .m-list li:active { background: rgba(176,141,87,0.09); }
  .m-list .idx {
    font-family:'JetBrains Mono',monospace; font-size: 12px; color: var(--console-active); opacity: 0.8;
    min-width: 26px;
  }
  .m-list .name {
    font-family:'Work Sans',sans-serif; font-size: 17px; font-weight: 500; color: var(--body-ink); flex: 1;
  }
  .m-list .coord {
    font-family:'JetBrains Mono',monospace; font-size: 10px; color: var(--console-dim);
  }
  .m-list .chev { color: var(--muted); font-size: 18px; }

  /* ============ modal (bottom sheet) ============ */
  .m-modal { position: fixed; inset: 0; z-index: 200; display: none; }
  .m-modal.open { display: block; }
  .m-modal-back {
    position: absolute; inset: 0; background: rgba(10,10,12,0.55);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .m-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-height: 86vh; overflow-y: auto;
    background: var(--paper);
    border-top-left-radius: 18px; border-top-right-radius: 18px;
    padding: 10px 22px calc(34px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(.16,1,.3,1);
  }
  .m-modal.open .m-sheet { transform: translateY(0); }
  .m-grabber { width: 40px; height: 4px; border-radius: 4px; background: var(--hairline); margin: 8px auto 18px; }
  .m-sheet-coords {
    display: block; font-family:'JetBrains Mono',monospace; font-size: 11px;
    letter-spacing: 0.05em; color: var(--muted); margin-bottom: 5px;
  }
  .m-sheet-title {
    font-family:'Bodoni Moda',serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: var(--label-tracking); color: var(--ink);
    font-size: 24px; margin: 0 0 10px;
  }
  .m-sheet-desc { font-family:'Work Sans',sans-serif; font-size: 15px; line-height: 1.55; color: var(--console-dim); margin: 0 0 22px; }
  .m-sheet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .m-sheet-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border: 1px solid var(--hairline); }
  .m-sheet-empty {
    font-family:'Work Sans',sans-serif; font-size: 14px; color: var(--console-dim);
    text-align: center; padding: 30px 0; margin: 0; border: 1px dashed var(--hairline);
  }
  .m-sheet-close {
    display: block; width: 100%; margin-top: 22px;
    background: transparent; border: 1.5px solid var(--ink); color: var(--ink);
    font-family:'Bodoni Moda',serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: var(--label-tracking); font-size: 13px; padding: 14px; cursor: pointer;
  }
  .m-sheet-close:active { background: var(--ink); color: var(--paper); }

  /* ---- catalog carousel inside the sheet ---- */
  .m-cat { position: relative; --fw: 66%; --fg: 12px; }
  .m-cat-viewport {
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: 4px calc(50% - var(--fw) / 2) 6px;
    margin: 0 -22px; /* let frames use full sheet width */
  }
  .m-cat-viewport::-webkit-scrollbar { display: none; }
  .m-cat-strip { display: flex; gap: var(--fg); }
  .m-cat-frame {
    flex: 0 0 var(--fw); width: var(--fw); scroll-snap-align: center;
    position: relative; border: 1px solid var(--hairline); background: #fff; overflow: hidden;
    opacity: 0.5; filter: brightness(0.92);
    transition: opacity 0.3s ease, filter 0.3s ease, box-shadow 0.3s ease;
  }
  .m-cat-frame img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
  .m-cat-frame.active { opacity: 1; filter: none; box-shadow: 0 0 0 2px var(--ink); }
  .m-cat-frame-num {
    position: absolute; top: 6px; left: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.05em;
    color: #fff; background: rgba(47,82,73,0.78); padding: 2px 6px;
  }
  .m-cat-index { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 14px; }
  .m-cat-bars { display: flex; align-items: center; gap: 4px; height: 30px; }
  .m-cat-bars i {
    display: block; width: 2px; height: 8px; background: rgba(44,44,44,0.26); border-radius: 2px;
    transition: height 0.2s ease, background-color 0.2s ease;
  }
  .m-cat-bars i.active { background: var(--ink); }
  .m-cat-readout { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--muted); }
  .m-cat-upload {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: max-content; margin: 18px auto 0; padding: 13px 24px; cursor: pointer;
    border: 1.5px dashed var(--hairline); color: var(--ink);
    font-family: 'Bodoni Moda', serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: var(--label-tracking); font-size: 12px;
    -webkit-tap-highlight-color: transparent;
  }
  .m-cat-upload:active, .m-cat.dragover .m-cat-upload { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ---- full-screen image viewer ---- */
  .m-viewer {
    position: fixed; inset: 0; z-index: 300; display: none; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .m-viewer.open { display: flex; }
  .m-viewer-back { position: absolute; inset: 0; background: rgba(10,10,12,0.94); }
  .m-viewer-img {
    position: relative; z-index: 1; max-width: 94vw; max-height: 78vh; object-fit: contain;
    -webkit-user-drag: none; user-select: none; pointer-events: none;
  }
  .m-viewer-close {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 16px; z-index: 3;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #fff;
    font-size: 24px; line-height: 1; cursor: pointer;
  }
  .m-viewer-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4); background: rgba(0,0,0,0.28); color: #fff;
    font-size: 24px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .m-viewer-nav.prev { left: 10px; } .m-viewer-nav.next { right: 10px; }
  .m-viewer-readout {
    position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 3;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: rgba(255,255,255,0.85);
  }

  @media (prefers-reduced-motion: reduce) {
    .m-menu, .m-sheet, .m-burger span, .m-pin svg, .m-pin .pin-ring, .m-hint { transition: none !important; animation: none !important; }
  }
</style>
</head>

<!-- intro gate (once per visit, shared with the rest of the site) -->
<div id="loader-overlay">
  <div id="loader-strips">
    <div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div><div class="loader-strip"></div>
  </div>
  <button id="explore-btn" class="explore-btn" type="button">Explore</button>
</div>
<script>
  (() => {
    const overlay = document.getElementById('loader-overlay');
    const btn = document.getElementById('explore-btn');
    if (!overlay || !btn) return;
    if (sessionStorage.getItem('introSeen')) { overlay.style.display = 'none'; return; }
    const strips = overlay.querySelectorAll('.loader-strip');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    btn.addEventListener('click', () => {
      sessionStorage.setItem('introSeen', '1');
      if (reduce) { overlay.style.display = 'none'; return; }
      const total = 900, dur = 450, stagger = (total - dur) / (strips.length - 1);
      btn.style.transform = 'rotate(360deg)';
      strips.forEach((s, i) => setTimeout(() => { s.style.transform = 'translateY(-100%)'; }, i * stagger));
      setTimeout(() => { btn.style.opacity = '0'; }, 300);
      setTimeout(() => { overlay.style.display = 'none'; }, total);
    });
  })();
</script>

  <a href="oasis.html">Playground</a>

<script>
  (() => {
    const burger = document.getElementById('m-burger');
    const menu = document.getElementById('m-menu');
    if (!burger || !menu) return;
    function toggle(open) {
      const isOpen = open ?? !menu.classList.contains('open');
      menu.classList.toggle('open', isOpen);
      burger.classList.toggle('open', isOpen);
      burger.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }
    burger.addEventListener('click', () => toggle());
    menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => toggle(false)));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
  })();
</script>

<script>
  // ---- location data (single source for pins + list + modal) ----
  const greeceSeed = Array.from({ length: 20 }, (_, i) =>
    'img/greece/ohiosunset_fall25_' + String(i + 1).padStart(2, '0') + '.jpg');
  const LOCATIONS = [
    { id:'amsterdam',   name:'Amsterdam',   left:51.361, top:20.906, coord:'52.37°N 4.90°E',   desc:'Add a project description for Amsterdam.', photos:[] },
    { id:'edinburgh',   name:'Edinburgh',   left:49.114, top:18.917, coord:'55.95°N 3.19°W',   desc:'Add a project description for Edinburgh.', photos:[] },
    { id:'greece',      name:'Greece',      left:56.592, top:28.900, coord:'37.98°N 23.73°E',  desc:'A summer project shot across the islands and coastline.', photos:greeceSeed },
    { id:'istanbul',    name:'Istanbul',    left:58.050, top:27.217, coord:'41.01°N 28.98°E',  desc:'Add a project description for Istanbul.', photos:[] },
    { id:'japan',       name:'Japan',       left:88.803, top:30.178, coord:'35.68°N 139.65°E', desc:'Add a project description for Japan.', photos:[] },
    { id:'la',          name:'LA',          left:17.156, top:31.083, coord:'34.05°N 118.24°W', desc:'Add a project description for LA.', photos:[] },
    { id:'london',      name:'London',      left:49.964, top:21.383, coord:'51.51°N 0.13°W',   desc:'Add a project description for London.', photos:[] },
    { id:'philippines', name:'Philippines', left:83.606, top:41.889, coord:'14.60°N 120.98°E', desc:'Add a project description for the Philippines.', photos:[] },
    { id:'puerto-rico', name:'Puerto Rico', left:31.633, top:39.739, coord:'18.47°N 66.11°W',  desc:'Add a project description for Puerto Rico.', photos:[] },
    { id:'santorini',   name:'Santorini',   left:57.072, top:29.783, coord:'36.39°N 25.46°E',  desc:'Add a project description for Santorini.', photos:[] },
    { id:'scotland',    name:'Scotland',    left:48.833, top:18.617, coord:'56.49°N 4.20°W',   desc:'Add a project description for Scotland.', photos:[] },
    { id:'toronto',     name:'Toronto',     left:27.950, top:25.750, coord:'43.65°N 79.38°W',  desc:'Add a project description for Toronto.', photos:[] },
  ];

  const PIN_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';

  // ---- build pins + list ----
  const zoomLayer = document.getElementById('m-zoom-layer');
  const list = document.getElementById('m-list');
  const pinEls = {};

  LOCATIONS.forEach((loc, i) => {
    const pin = document.createElement('a');
    pin.href = '#'; pin.className = 'm-pin'; pin.id = 'mpin-' + loc.id;
    pin.style.left = loc.left + '%'; pin.style.top = loc.top + '%';
    pin.innerHTML = '<span class="pin-hit"></span><span class="pin-ring"></span>' + PIN_SVG;
    pin.addEventListener('click', (e) => { e.preventDefault(); openSheet(loc); });
    zoomLayer.appendChild(pin);
    pinEls[loc.id] = pin;

    const li = document.createElement('li');
    li.innerHTML =
      '<span class="idx">' + String(i + 1).padStart(3, '0') + '</span>' +
      '<span class="name">' + loc.name + '</span>' +
      '<span class="coord">' + loc.coord + '</span>' +
      '<span class="chev">&rsaquo;</span>';
    li.addEventListener('click', () => openSheet(loc));
    list.appendChild(li);
  });

  // ---- modal / bottom sheet + catalog + full-screen viewer ----
  const modal = document.getElementById('m-modal');
  const sTitle = document.getElementById('m-sheet-title');
  const sCoords = document.getElementById('m-sheet-coords');
  const sDesc = document.getElementById('m-sheet-desc');
  const sEmpty = document.getElementById('m-sheet-empty');
  const cat = document.getElementById('m-cat');
  const catVp = document.getElementById('m-cat-viewport');
  const catStrip = document.getElementById('m-cat-strip');
  const catBars = document.getElementById('m-cat-bars');
  const catIndex = document.getElementById('m-cat-index');
  const catReadout = document.getElementById('m-cat-readout');
  const catInput = document.getElementById('m-cat-input');

  const viewer = document.getElementById('m-viewer');
  const viewerImg = document.getElementById('m-viewer-img');
  const viewerReadout = document.getElementById('m-viewer-readout');
  const viewerPrev = document.getElementById('m-viewer-prev');
  const viewerNext = document.getElementById('m-viewer-next');

  let activePin = null, currentLoc = null, activeIndex = 0, viewerIndex = 0;
  const pad = n => String(n).padStart(2, '0');
  const catFrames = () => [...catStrip.children];

  function renderCatalog() {
    const photos = currentLoc.photos || (currentLoc.photos = []);
    catStrip.innerHTML = ''; catBars.innerHTML = '';
    const has = photos.length > 0;
    catVp.style.display = has ? 'block' : 'none';
    catIndex.style.display = has ? 'flex' : 'none';
    sEmpty.style.display = has ? 'none' : 'block';
    if (!has) { catReadout.textContent = 'IMG 00 / 00'; return; }
    photos.forEach((src, i) => {
      const frame = document.createElement('div');
      frame.className = 'm-cat-frame';
      frame.innerHTML = '<div class="m-cat-frame-num">' + pad(i + 1) + '</div>' +
        '<img src="' + src + '" alt="' + currentLoc.name + ' ' + (i + 1) + '" loading="lazy">';
      frame.addEventListener('click', () => { if (i === activeIndex) openViewer(i); else catGoTo(i); });
      catStrip.appendChild(frame);
      catBars.appendChild(document.createElement('i'));
    });
    activeIndex = 0;
    requestAnimationFrame(() => { catGoTo(0, false); catUpdateActive(); });
  }
  function catGoTo(i, smooth = true) {
    const fr = catFrames(); if (!fr.length) return;
    i = Math.max(0, Math.min(i, fr.length - 1));
    const el = fr[i];
    catVp.scrollTo({ left: el.offsetLeft + el.clientWidth / 2 - catVp.clientWidth / 2, behavior: smooth ? 'smooth' : 'auto' });
  }
  function catUpdateActive() {
    const fr = catFrames(); if (!fr.length) return;
    const mid = catVp.scrollLeft + catVp.clientWidth / 2;
    let best = 0, bd = Infinity;
    fr.forEach((el, i) => { const c = el.offsetLeft + el.clientWidth / 2, d = Math.abs(c - mid); if (d < bd) { bd = d; best = i; } });
    activeIndex = best;
    fr.forEach((el, i) => el.classList.toggle('active', i === best));
    [...catBars.children].forEach((bar, i) => {
      const close = Math.max(0, 1 - Math.abs(i - best) / 6);
      bar.style.height = (8 + close * 22).toFixed(1) + 'px';
      bar.classList.toggle('active', i === best);
    });
    catReadout.textContent = 'IMG ' + pad(best + 1) + ' / ' + pad(fr.length);
  }
  let catRAF = null;
  catVp.addEventListener('scroll', () => { if (catRAF) return; catRAF = requestAnimationFrame(() => { catUpdateActive(); catRAF = null; }); });

  // uploads — file picker + drag/drop, session-only preview URLs
  function addFiles(files) {
    const imgs = [...files].filter(f => f.type.startsWith('image/'));
    if (!imgs.length || !currentLoc) return;
    imgs.forEach(f => currentLoc.photos.push(URL.createObjectURL(f)));
    const jump = currentLoc.photos.length - imgs.length;
    renderCatalog();
    requestAnimationFrame(() => catGoTo(jump));
  }
  catInput.addEventListener('change', e => { addFiles(e.target.files); catInput.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => cat.addEventListener(ev, e => { e.preventDefault(); cat.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach(ev => cat.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || e.target === cat) cat.classList.remove('dragover'); }));
  cat.addEventListener('drop', e => { if (e.dataTransfer) addFiles(e.dataTransfer.files); });

  // full-screen viewer
  function showViewerPhoto() {
    const photos = currentLoc.photos || [];
    if (!photos.length) return;
    viewerIndex = (viewerIndex + photos.length) % photos.length; // wrap
    viewerImg.src = photos[viewerIndex];
    viewerImg.alt = currentLoc.name + ' ' + (viewerIndex + 1);
    viewerReadout.textContent = 'IMG ' + pad(viewerIndex + 1) + ' / ' + pad(photos.length);
    const multi = photos.length > 1;
    viewerPrev.style.display = multi ? 'flex' : 'none';
    viewerNext.style.display = multi ? 'flex' : 'none';
  }
  function openViewer(i) { viewerIndex = i; showViewerPhoto(); viewer.classList.add('open'); viewer.setAttribute('aria-hidden', 'false'); }
  function viewerGo(i) { viewerIndex = i; showViewerPhoto(); }
  function closeViewer() { viewer.classList.remove('open'); viewer.setAttribute('aria-hidden', 'true'); viewerImg.src = ''; catGoTo(viewerIndex, false); }
  viewer.querySelectorAll('[data-vclose]').forEach(el => el.addEventListener('click', closeViewer));
  viewerPrev.addEventListener('click', () => viewerGo(viewerIndex - 1));
  viewerNext.addEventListener('click', () => viewerGo(viewerIndex + 1));

  // swipe left/right to move through photos in the full-screen viewer
  (() => {
    const THRESH = 45; // px before a drag counts as a swipe
    let sx = 0, sy = 0, dragging = false, swiped = false;
    viewer.addEventListener('pointerdown', (e) => {
      if (e.target === viewerPrev || e.target === viewerNext) return;
      dragging = true; swiped = false; sx = e.clientX; sy = e.clientY;
      viewerImg.style.transition = 'none';
    });
    viewer.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - sx;
      if (Math.abs(dx) > Math.abs(e.clientY - sy)) viewerImg.style.transform = 'translateX(' + dx * 0.35 + 'px)';
    });
    function endSwipe(e) {
      if (!dragging) return;
      dragging = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      viewerImg.style.transition = 'transform 0.25s ease';
      viewerImg.style.transform = '';
      if (Math.abs(dx) > THRESH && Math.abs(dx) > Math.abs(dy)) {
        swiped = true; // suppress the click that a drag would otherwise fire (e.g. backdrop-close)
        viewerGo(dx < 0 ? viewerIndex + 1 : viewerIndex - 1);
      }
    }
    viewer.addEventListener('pointerup', endSwipe);
    viewer.addEventListener('pointercancel', () => { dragging = false; viewerImg.style.transform = ''; });
    viewer.addEventListener('click', (e) => { if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; } }, true);
  })();

  function openSheet(loc) {
    if (activePin) activePin.classList.remove('pin-active');
    activePin = pinEls[loc.id];
    if (activePin) activePin.classList.add('pin-active');
    currentLoc = loc;
    sTitle.textContent = loc.name;
    sCoords.textContent = loc.coord;
    sDesc.textContent = loc.desc;
    renderCatalog();
    modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (activePin) { activePin.classList.remove('pin-active'); activePin = null; }
  }
  modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));
  document.addEventListener('keydown', e => {
    if (viewer.classList.contains('open')) {
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'ArrowLeft') viewerGo(viewerIndex - 1);
      else if (e.key === 'ArrowRight') viewerGo(viewerIndex + 1);
      return;
    }
    if (e.key === 'Escape') closeSheet();
  });

  // ---- clock ----
  (() => {
    const el = document.getElementById('m-clock');
    const p = n => String(n).padStart(2, '0');
    function tick() { const d = new Date(); el.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
    tick(); setInterval(tick, 1000);
  })();
</script>

<script>
  // ---- touch map: one-finger pan, two-finger pinch, +/- buttons ----
  (() => {
    const vp = document.getElementById('m-viewport');
    const layer = document.getElementById('m-zoom-layer');
    const hint = document.getElementById('m-hint');
    const inBtn = document.getElementById('m-zoom-in');
    const outBtn = document.getElementById('m-zoom-out');
    if (!vp || !layer) return;

    const MIN = 1, MAX = 4;
    let scale = 1, tx = 0, ty = 0;
    const pointers = new Map();
    let startDist = 0, startScale = 1, startMid = { x: 0, y: 0 }, startTx = 0, startTy = 0;
    let moved = false;

    function apply(animate) {
      layer.style.transition = animate ? 'transform 0.3s cubic-bezier(.16,1,.3,1)' : 'none';
      layer.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    }
    function clamp() {
      const r = vp.getBoundingClientRect();
      const maxX = (scale - 1) * r.width, maxY = (scale - 1) * r.height;
      tx = Math.min(0, Math.max(-maxX, tx));
      ty = Math.min(0, Math.max(-maxY, ty));
    }
    // zoom toward a viewport-local point (px, py)
    function zoomTo(next, px, py) {
      next = Math.min(MAX, Math.max(MIN, next));
      const k = next / scale;
      tx = px - k * (px - tx);
      ty = py - k * (py - ty);
      scale = next;
      clamp();
    }
    function localPoint(clientX, clientY) {
      const r = vp.getBoundingClientRect();
      return { x: clientX - r.left, y: clientY - r.top };
    }
    function hideHint() { if (hint) hint.style.opacity = '0'; }

    vp.addEventListener('pointerdown', (e) => {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved = false;
      if (pointers.size === 2) {
        const pts = [...pointers.values()];
        startDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        startScale = scale;
        const midClient = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        startMid = localPoint(midClient.x, midClient.y);
        startTx = tx; startTy = ty;
      }
    });

    vp.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      const prev = pointers.get(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 2) {
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const midClient = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        const mid = localPoint(midClient.x, midClient.y);
        const next = Math.min(MAX, Math.max(MIN, startScale * (dist / startDist)));
        const k = next / startScale;
        // scale around the initial midpoint, then follow finger midpoint drift
        tx = startMid.x - k * (startMid.x - startTx) + (mid.x - startMid.x);
        ty = startMid.y - k * (startMid.y - startTy) + (mid.y - startMid.y);
        scale = next;
        clamp(); apply(false); moved = true; hideHint();
      } else if (pointers.size === 1 && scale > 1) {
        tx += e.clientX - prev.x;
        ty += e.clientY - prev.y;
        clamp(); apply(false); moved = true; hideHint();
      }
    });

    function endPointer(e) { pointers.delete(e.pointerId); }
    vp.addEventListener('pointerup', endPointer);
    vp.addEventListener('pointercancel', endPointer);
    vp.addEventListener('pointerleave', endPointer);

    // block pin navigation if the touch was actually a drag
    vp.addEventListener('click', (e) => { if (moved) { e.preventDefault(); e.stopPropagation(); } }, true);

    const r0 = () => vp.getBoundingClientRect();
    inBtn.addEventListener('click', () => { const r = r0(); zoomTo(scale + 0.6, r.width / 2, r.height / 2); apply(true); hideHint(); });
    outBtn.addEventListener('click', () => { const r = r0(); zoomTo(scale - 0.6, r.width / 2, r.height / 2); apply(true); hideHint(); });

    // double-tap to zoom in / reset
    let lastTap = 0;
    vp.addEventListener('pointerup', (e) => {
      const now = Date.now();
      if (now - lastTap < 280 && !moved) {
        const p = localPoint(e.clientX, e.clientY);
        if (scale > 1.2) { scale = 1; tx = 0; ty = 0; clamp(); } else { zoomTo(2.4, p.x, p.y); }
        apply(true); hideHint();
      }
      lastTap = now;
    });

    apply(false);
  })();
</script>
